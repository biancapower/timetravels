name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 03:00 UTC: catches breakage when nothing in the repo changed.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    # Docs-only changes skip the tests. This is done in a job rather than with
    # paths-ignore so that the gate job always reports; a required check that
    # never reports blocks the pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="origin/$BASE_REF...HEAD" ;;
            push) range="$BEFORE..HEAD" ;;
            *) range="" ;;
          esac
          if [ -z "$range" ] || ! files="$(git diff --name-only "$range")"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qvE '^docs/|\.md$' <<<"$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - if: github.event_name != 'schedule'
        run: pnpm check
      - if: github.event_name == 'schedule'
        run: pnpm browsers --with-deps
      - if: github.event_name == 'schedule'
        run: pnpm check:full

  gate:
    # The only required status check.
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
